  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%228%22 y=%228%22 width=%2284%22 height=%2284%22 rx=%2212%22 fill=%22%23C8402A%22/><text x=%2250%22 y=%2247%22 font-size=%2234%22 text-anchor=%22middle%22 fill=%22%23F3E6CC%22 font-family=%22serif%22 font-weight=%22800%22>Y</text><text x=%2250%22 y=%2280%22 font-size=%2234%22 text-anchor=%22middle%22 fill=%22%23F3E6CC%22 font-family=%22serif%22 font-weight=%22800%22>V</text></svg>">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    // GitHub Pages SPA redirect trick
    // When GH Pages 404s on /portfolio, /about, etc., it serves this file.
    // We encode the path into the query string so index.html can restore it.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?/' + l.pathname.slice(1) +
      (l.search ? '&' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>

</html>
